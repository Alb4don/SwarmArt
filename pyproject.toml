[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmart"
version = "1.2.0"
description = "Emergent generative art from autonomous agents following local rules"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.25",
    "pygame-ce>=2.4",
    "Pillow>=10.0",
    "PySide6>=6.5",
]
classifiers = [
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Artistic Software",
]

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.5"]

[project.scripts]
swarmart = "swarmart.app:main"

[project.gui-scripts]
swarmart-gui = "swarmart.app:main"

[tool.setuptools]
packages = ["swarmart"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "I"]
